<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdessamad ach</title>
    <style>
        /* ستايل SpaceX - نقي، أسود، وأبيض */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 50px;
            position: sticky;
            top: 0;
            background: white;
            z-index: 1000;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #000000;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            margin-left: 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* التصاور بستايل "SpaceX" */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            padding: 50px;
        }

        .card {
            background-color: #f4f4f4;
            height: 500px;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            color: black;
            text-decoration: none;
            transition: 0.3s;
        }

        .card:hover {
            background-color: #e0e0e0;
        }

        .card h2 {
            font-size: 28px;
            margin: 0;
            text-transform: uppercase;
        }
<style>
        
.logo-link {
    display: inline-block;
    width: 150px;
    height: 50px;
    background-image: url('achweb.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: left;
    cursor: grab;
    /* زيدي هاد السطر باش تضمن أن اللوغو يبان */
    vertical-align: middle; 
}
}
</style>

</head>
<body>

  <nav class="navbar">
    <a href="https://abdessamad-exe.github.io/ach" class="logo-link"></a>
    
    <div class="nav-links">
        <a href="#">Projects</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</nav>
   

</body>
</html>
