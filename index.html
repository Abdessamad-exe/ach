<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACH.MA | قريباً</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a24;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        /* القائمة العلوية */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #111118;
            border-bottom: 1px solid #2a2a3a;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-right: 20px;
        }
        nav ul li a {
            color: #a0a0b0;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            color: #ffcc00;
        }
        /* الواجهة الرئيسية */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #252535 0%, #1a1a24 100%);
            margin-top: 60px;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .hero h1 span {
            color: #ffcc00;
        }
        .hero p {
            font-size: 1.2rem;
            color: #a0a0b0;
            max-width: 600px;
            margin-bottom: 40px;
        }
        /* الأزرار */
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s ease;
        }
        .btn-primary {
            background-color: #ffcc00;
            color: #111118;
        }
        .btn-primary:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
        }
        .btn-secondary {
            border: 2px solid #2a2a3a;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: #2a2a3a;
            transform: translateY(-2px);
        }
        /* أسفل الصفحة */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #111118;
            color: #606070;
            font-size: 14px;
            border-top: 1px solid #2a2a3a;
        }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <header>
        <div class="logo">ACH<span>.ma</span></div>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">علينا</a></li>
                <li><a href="#">الخدمات</a></li>
                <li><a href="#">اتصل بنا</a></li>
            </ul>
        </nav>
    </header>

    <!-- الواجهة الرئيسية -->
    <section class="hero">
        <h1>مرحباً بكم في <span>ACH.ma</span></h1>
        <p>الموقع ديالنا حالياً قيد التطوير والتجهيز. هاد البلاصة مخصصة باش تحط فيها الفكرة والتعريف بالمشروع ديالك مستقبلاً.</p>
        <div class="btn-group">
            <a href="#" class="btn btn-primary">اكتشف المزيد</a>
            <a href="#" class="btn btn-secondary">تواصل معنا</a>
        </div>
    </section>

    <!-- أسفل الصفحة -->
    <footer>
        جميع الحقوق محفوظة © 2026 - ACH.ma
    </footer>

</body>
</html>
